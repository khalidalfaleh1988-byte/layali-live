<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ليالي لايف - Layali Live</title>
    <style>
        :root {
            --bg-dark: #0B0813;
            --bg-card: #151026;
            --purple-neon: #A855F7;
            --purple-glow: rgba(168, 85, 247, 0.4);
            --pink-accent: #EC4899;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            background: linear-gradient(180deg, #120B22 0%, #0B0813 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.15);
        }
        .header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(21, 16, 38, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.1);
        }
        .header-tabs {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: 600;
        }
        .header-tabs span {
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
        }
        .header-tabs span.active {
            color: var(--text-main);
        }
        .header-tabs span.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            right: 50%;
            transform: translateX(50%);
            width: 20px;
            height: 3px;
            background: var(--purple-neon);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--purple-neon);
        }
        .header-icons {
            display: flex;
            gap: 15px;
            color: var(--text-main);
            font-size: 18px;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 80px;
        }
        .banner {
            background: linear-gradient(135deg, #2D1B4E 0%, #1A102F 100%);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 20px var(--purple-glow);
        }
        .banner h2 {
            font-size: 18px;
            color: #F3E8FF;
            margin-bottom: 5px;
        }
        .banner p {
            font-size: 12px;
            color: var(--text-muted);
        }
        .rooms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .room-card {
            background: var(--bg-card);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(168, 85, 247, 0.15);
            position: relative;
            aspect-ratio: 3/4;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
            background-size: cover;
            background-position: center;
        }
        .room-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(11, 8, 19, 0.9) 100%);
        }
        .room-info {
            position: relative;
            z-index: 2;
        }
        .room-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }
