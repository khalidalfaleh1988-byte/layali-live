<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليالي لايف - سهرات خليجية حية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(217, 119, 6, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- الهيدر -->
    <header class="bg-[#111827] border-b border-gray-800 p-4 text-center sticky top-0 z-50">
        <h1 class="text-2xl font-black text-amber-500 tracking-wider">✨ ليالي لايف</h1>
        <p class="text-xs text-gray-400 mt-1">سوالف وسهرات خليجية حية 24/7</p>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col gap-6">

        <!-- بانر الهيرو -->
        <div class="relative rounded-2xl overflow-hidden glow-effect border border-amber-500/30">
            <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=800&q=80" alt="سهرة خليجية" class="w-full h-48 object-cover opacity-60">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-transparent to-transparent flex items-end p-4">
                <span class="bg-amber-500 text-gray-950 font-bold text-xs px-3 py-1 rounded-full shadow-lg">🔥 رومَات الخليج المباشرة</span>
            </div>
        </div>

        <!-- قائمة الرومات -->
        <section class="flex flex-col gap-3">
            <h2 class="text-sm font-bold text-gray-300">اختر الروم للمشاركة:</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2" id="rooms-list">
                <button onclick="changeRoom('الرياض')" class="room-btn bg-[#1f2937] border border-amber-500/50 p-3 rounded-xl text-right font-bold text-amber-400 transition hover:bg-[#374151]">🌴 صالة الرياض</button>
                <button onclick="changeRoom('جدة')" class="room-btn bg-[#1f2937] border border-gray-800 p-3 rounded-xl text-right font-medium text-gray-300 transition hover:bg-[#374151]">🌊 سهرة جدة العروس</button>
                <button onclick="changeRoom('الكويت')" class="room-btn bg-[#1f2937] border border-gray-800 p-3 rounded-xl text-right font-medium text-gray-300 transition hover:bg-[#374151]">🇰🇼 ديوانية الكويت</button>
                <button onclick="changeRoom('دبي')" class="room-btn bg-[#1f2937] border border-gray-800 p-3 rounded-xl text-right font-medium text-gray-300 transition hover:bg-[#374151]">🇦🇪 جلسة دبي</button>
            </div>
        </section>

        <!-- قسم الشات الحي -->
        <section class="bg-[#111827] border border-gray-800 rounded-2xl p-4 flex flex-col h-96">
            <div class="border-b border-gray-800 pb-2 mb-3 flex justify-between items-center">
                <h3 id="current-room-title" class="font-bold text-amber-400">🌴 الشات العام - صالة الرياض</h3>
                <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full animate-pulse">● متصل مباشر</span>
            </div>

            <!-- صندوق الرسائل -->
            <div id="chat-messages" class="flex-1 overflow-y-auto flex flex-col gap-3 p-2 text-sm">
                <div class="text-center text-xs text-gray-500 my-2">جاري تحميل الرسائل الحية...</div>
            </div>

            <!-- إرسال رسالة -->
            <form id="chat-form" onsubmit="sendMessage(event)" class="mt-3 flex gap-2">
                <input type="text" id="username-input" placeholder="اسمك..." class="bg-[#1f2937] border border-gray-700 rounded-xl px-3 py-2 text-sm w-1/3 focus:outline-none focus:border-amber-500" required>
                <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." class="bg-[#1f2937] border border-gray-700 rounded-xl px-3 py-2 text-sm flex-1 focus:outline-none focus:border-amber-500" required>
                <button type="submit" class="bg-amber-500 text-gray-950 font-bold px-4 py-2 rounded-xl text-sm hover:bg-amber-400 transition">إرسال</button>
            </form>
        </section>

    </main>

    <footer class="text-center text-xs text-gray-500 py-4 border-t border-gray-800 mt-auto">
        جميع الحقوق محفوظة © ليالي لايف 2026
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDtg8dgBoFjq8VjO1WAtGaDjJW5GLTTeL0",
          authDomain: "layali-live-aa1b8.firebaseapp.com",
          projectId: "layali-live-aa1b8",
          storageBucket: "layali-live-aa1b8.firebasestorage.app",
          messagingSenderId: "905339337466",
          appId: "1:905339337466:web:abc824a6d37475bacde743",
          measurementId: "G-WQQX9ZEB0Z"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentRoom = "الرياض";
        let unsubscribe = null;

        window.changeRoom = function(roomName) {
            currentRoom = roomName;
            document.getElementById('current-room-title').innerText = `🌴 الشات العام - صالة ${roomName}`;
            
            // تحديث الأزرار
            document.querySelectorAll('.room-btn').forEach(btn => {
                if(btn.innerText.includes(roomName)) {
                    btn.classList.add('border-amber-500', 'text-amber-400');
                    btn.classList.remove('border-gray-800', 'text-gray-300');
                } else {
                    btn.classList.remove('border-amber-500', 'text-amber-400');
                    btn.classList.add('border-gray-800', 'text-gray-300');
                }
            });

            loadMessages();
        }

        function loadMessages() {
            const chatContainer = document.getElementById('chat-messages');
            chatContainer.innerHTML = '<div class="text-center text-xs text-gray-500 my-2">جاري جلب الرسائل...</div>';

            if (unsubscribe) unsubscribe();

            const q = query(collection(db, `rooms_${currentRoom}_messages`), orderBy('timestamp', 'asc'));
            
            unsubscribe = onSnapshot(q, (snapshot) => {
                chatContainer.innerHTML = '';
                if(snapshot.empty) {
                    chatContainer.innerHTML = '<div class="text-center text-xs text-gray-500 my-4">ما بعد بدات السهرة، اكتب اول رسالة! ✨</div>';
                    return;
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const msgDiv = document.createElement('div');
                    msgDiv.className = "bg-[#1f2937] p-2.5 rounded-xl max-w-[80%]";
                    msgDiv.innerHTML = `<span class="text-xs font-bold text-amber-400 block mb-0.5">${escapeHtml(data.username)}</span><span class="text-gray-200">${escapeHtml(data.text)}</span>`;
                    chatContainer.appendChild(msgDiv);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        window.sendMessage = async function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username-input');
            const messageInput = document.getElementById('message-input');
            
            const username = usernameInput.value.trim();
            const text = messageInput.value.trim();

            if(!username || !text) return;

            try {
                await addDoc(collection(db, `rooms_${currentRoom}_messages`), {
                    username: username,
                    text: text,
                    timestamp: serverTimestamp()
                });
                messageInput.value = '';
            } catch (error) {
                console.error("خطأ في الإرسال: ", error);
                alert("تعذر إرسال الرسالة، تأكد من إعدادات قاعدة البيانات Firestore.");
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // تحميل رسائل الروم الافتراضي عند فتح الصفحة
        loadMessages();
    </script>
</body>
</html>
