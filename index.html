<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليالي لايف - Layali Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-top: 40px;
        }
        header h1 {
            font-size: 2.5rem;
            color: #f43f5e;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }
        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin: 20px 0;
        }
        .btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4);
            margin-top: 20px;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.6);
        }
        footer {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌙 ليالي لايف</h1>
        <p>منصة البث المباشر والدردشة التفاعلية</p>
    </header>

    <div class="container">
        <h2>أهلاً بك في عالم البثوث الحية</h2>
        <p style="margin-top: 15px; color: #cbd5e1;">التطبيق قيد التشغيل المباشر عبر GitHub Pages. استمتع بالتجربة!</p>
        <button class="btn" onclick="alert('أهلاً بك! تم تفعيل زر التفاعل بنجاح 🎉')">دخول البث المباشر</button>
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; 2026 ليالي لايف
    </footer>

</body>
</html>
