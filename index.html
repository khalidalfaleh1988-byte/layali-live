<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليالي لايف - سهرات خليجية حية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(217, 119, 6, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- الهيدر -->
    <header class="bg-[#111827] border-b border-gray-800 p-4 text-center sticky top-0 z-50">
        <h1 class="text-xl font-black text-amber-500 tracking-wider">✨ ليالي لايف</h1>
        <p class="text-xs text-gray-400 mt-0.5">سوالف وسهرات خليجية حية 24/7</p>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-3 flex flex-col gap-4">

        <!-- البانر -->
        <div class="relative rounded-2xl overflow-hidden glow-effect border border-amber-500/30">
            <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=800&q=80" alt="سهرة خليجية" class="w-full h-36 object-cover opacity-50">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-transparent to-transparent flex items-end p-3">
                <span class="bg-amber-500 text-gray-950 font-bold text-xs px-2.5 py-1 rounded-full">🔥 رومَات الخليج المباشرة</span>
            </div>
        </div>

        <!-- قائمة الرومات (أزرار أفقية مصفوفة بشكل مرتب) -->
        <section class="flex flex-col gap-2">
            <h2 class="text-xs font-bold text-gray-400 px-1">اختر الروم:</h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="rooms-list">
                <button onclick="changeRoom('الرياض')" class="room-btn bg-[#1f2937] border border-amber-500 p-2.5 rounded-xl text-center font-bold text-amber-400 text-xs transition shadow-sm">🌴 الرياض</button>
                <button onclick="changeRoom('جدة')" class="room-btn bg-[#1f2937] border border-gray-800 p-2.5 rounded-xl text-center font-medium text-gray-300 text-xs transition shadow-sm">🌊 جدة</button>
                <button onclick="changeRoom('الكويت')" class="room-btn bg-[#1f2937] border border-gray-800 p-2.5 rounded-xl text-center font-medium text-gray-300 text-xs transition shadow-sm">🇰🇼 الكويت</button>
                <button onclick="changeRoom('دبي')" class="room-btn bg-[#1f2937] border border-gray-800 p-2.5 rounded-xl text-center font-medium text-gray-300 text-xs transition shadow-sm">🇦🇪 دبي</button>
            </div>
        </section>

        <!-- صندوق الشات الحي المتكامل -->
        <section class="bg-[#111827] border border-gray-800 rounded-2xl flex flex-col h-[420px] overflow-hidden shadow-xl">
            
            <!-- هيدر الشات الداخلي -->
            <div class="bg-[#161f31] border-b border-gray-800 px-4 py-3 flex justify-between items-center">
                <h3 id="current-room-title" class="font-bold text-amber-400 text-sm">🌴 صالة الرياض</h3>
                <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-medium">● متصل</span>
            </div>

            <!-- قائمة الرسائل (فقاعات شات احترافية) -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2.5 text-sm">
                <div class="text-center text-xs text-gray-500 my-auto">جاري التحميل...</div>
            </div>

            <!-- شريط الكتابة والإرسال -->
            <form id="chat-form" onsubmit="sendMessage(event)" class="bg-[#161f31] border-t border-gray-800 p-2.5 flex gap-2 items-center">
                <input type="text" id="username-input" placeholder="اسمك" class="bg-[#0b0f19] border border-gray-700 rounded-xl px-3 py-2 text-xs w-24 text-amber-400 font-semibold focus:outline-none focus:border-amber-500" required>
                <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." class="bg-[#0b0f19] border border-gray-700 rounded-xl px-3 py-2 text-xs flex-1 text-gray-200 focus:outline-none focus:border-amber-500" required>
                <button type="submit" class="bg-amber-500 text-gray-950 font-bold px-4 py-2 rounded-xl text-xs hover:bg-amber-400 transition shadow-md">إرسال</button>
            </form>
        </section>

    </main>

    <footer class="text-center text-[10px] text-gray-500 py-3 border-t border-gray-800 mt-auto">
        جميع الحقوق محفوظة © ليالي لايف 2026
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDtg8dgBoFjq8VjO1WAtGaDjJW5GLTTeL0",
          authDomain: "layali-live-aa1b8.firebaseapp.com",
          projectId: "layali-live-aa1b8",
          storageBucket: "layali-live-aa1b8.firebasestorage.app",
          messagingSenderId: "905339337466",
          appId: "1:905339337466:web:abc824a6d37475bacde743",
          measurementId: "G-WQQX9ZEB0Z"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentRoom = "الرياض";
        let unsubscribe = null;

        window.changeRoom = function(roomName) {
            currentRoom = roomName;
            document.getElementById('current-room-title').innerText = `🌴 صالة ${roomName}`;
            
            document.querySelectorAll('.room-btn').forEach(btn => {
                if(btn.innerText.includes(roomName)) {
                    btn.classList.add('border-amber-500', 'text-amber-400', 'bg-[#1f2937]');
                    btn.classList.remove('border-gray-800', 'text-gray-300');
                } else {
                    btn.classList.remove('border-amber-500', 'text-amber-400');
                    btn.classList.add('border-gray-800', 'text-gray-300');
                }
            });

            loadMessages();
        }

        function loadMessages() {
            const chatContainer = document.getElementById('chat-messages');
            chatContainer.innerHTML = '<div class="text-center text-xs text-gray-500 my-auto">جاري جلب السوالف...</div>';

            if (unsubscribe) unsubscribe();

            const q = query(collection(db, `rooms_${currentRoom}_messages`), orderBy('timestamp', 'asc'));
            
            unsubscribe = onSnapshot(q, (snapshot) => {
                chatContainer.innerHTML = '';
                if(snapshot.empty) {
                    chatContainer.innerHTML = '<div class="text-center text-xs text-gray-500 my-auto">ما بعد بدات السهرة في هذه الصالة، كن أول المشاركين! ✨</div>';
                    return;
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const msgDiv = document.createElement('div');
                    msgDiv.className = "bg-[#1f2937] border border-gray-800/60 p-2.5 rounded-2xl max-w-[85%] shadow-sm flex flex-col";
                    msgDiv.innerHTML = `
                        <span class="text-[11px] font-extrabold text-amber-400 mb-1">${escapeHtml(data.username)}</span>
                        <span class="text-xs text-gray-100 break-words leading-relaxed">${escapeHtml(data.text)}</span>
                    `;
                    chatContainer.appendChild(msgDiv);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        window.sendMessage = async function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username-input');
            const messageInput = document.getElementById('message-input');
            
            const username = usernameInput.value.trim();
            const text = messageInput.value.trim();

            if(!username || !text) return;

            try {
                await addDoc(collection(db, `rooms_${currentRoom}_messages`), {
                    username: username,
                    text: text,
                    timestamp: serverTimestamp()
                });
                messageInput.value = '';
                messageInput.focus();
            } catch (error) {
                console.error("خطأ في الإرسال: ", error);
                alert("تعذر إرسال الرسالة.");
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        loadMessages();
    </script>
</body>
</html>
