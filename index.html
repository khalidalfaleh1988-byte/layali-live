<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليالي لايف - المجالس الخليجية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between p-6">

    <!-- الهيدر -->
    <header class="text-center py-6">
        <h1 class="text-3xl font-bold tracking-wider text-amber-400">✨ ليالي لايف</h1>
        <p class="text-xs text-slate-400 mt-1">انضم إلى السهرات والديوانيات الخليجية الحية</p>
    </header>

    <!-- صندوق تسجيل الدخول -->
    <main class="max-w-md w-mx mx-auto bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl">
        <h2 class="text-lg font-semibold mb-2 text-center">أهلاً بك في الديوانية</h2>
        <p class="text-xs text-slate-400 mb-6 text-center">اختر لقبك وادخل فوراً للتفاعل مع الأعضاء</p>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">اسم المستخدم / اللقب</label>
                <input type="text" id="usernameInput" required placeholder="مثال: فهد القحطاني" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 text-sm">
            </div>
            <button type="submit" 
                class="w-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-600/20 text-sm">
                دخول الديوانية الآن 🚀
            </button>
        </form>
    </main>

    <!-- الفوتر -->
    <footer class="text-center text-xs text-slate-600 py-4">
        جميع الحقوق محفوظة - ليالي لايف © 2026
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            if (username) {
                // حفظ الاسم محلياً والتوجه للديوانية
                localStorage.setItem('layali_user', username);
                window.location.href = 'rooms.html'; // أو صفحة الغرف الخاصة بك
            }
        });
    </script>
</body>
</html>
