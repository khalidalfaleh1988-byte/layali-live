<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليالي لايف - Luxury Gulf Majlis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #07090f;
            color: #f3f4f6;
            padding-bottom: 90px; /* مساحة للشريط السفلي العائم */
        }
        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gold-gradient {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 50%, #b45309 100%);
        }
        .gold-border {
            border: 2px solid transparent;
            background: linear-gradient(#0f172a, #0f172a) padding-box, linear-gradient(135deg, #fbbf24, #d97706) border-box;
        }
        .glow-gold {
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
        }
        /* إخفاء شريط التمرير */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #07090f; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- الهيدر الفخم -->
    <header class="glass-nav border-b border-gray-800/80 p-4 sticky top-0 z-50 flex justify-between items-center px-6">
        <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
            <h1 class="text-lg font-black tracking-wider text-amber-400">ليالي لايف <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30">VIP</span></h1>
        </div>
        <button onclick="openSettings()" class="w-9 h-9 rounded-full bg-gray-800/80 border border-gray-700 flex items-center justify-center text-amber-400 shadow-inner hover:scale-105 transition">⚙️</button>
    </header>

    <!-- المحتوى الرئيسي المتغير حسب التبويب -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col gap-5">

        <!-- تبويب الرئيسية (القصص والرومات) -->
        <div id="view-home" class="flex flex-col gap-5">
            
            <!-- شريط القصص (Stories) الخليجية الفخمة -->
            <div class="flex gap-3 overflow-x-auto pb-2 pt-1 no-scrollbar">
                <div class="flex flex-col items-center gap-1.5 flex-shrink-0 cursor-pointer group">
                    <div class="w-16 h-16 rounded-full gold-border p-0.5 flex items-center justify-center relative glow-gold">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" class="w-full h-full object-cover rounded-full">
                        <span class="absolute bottom-0 right-0 w-5 h-5 bg-amber-500 text-gray-950 rounded-full text-xs font-black flex items-center justify-center border-2 border-[#07090f]">+</span>
                    </div>
                    <span class="text-[11px] text-gray-300 font-medium">قصتك</span>
                </div>
                <!-- قصة مستخدم -->
                <div class="flex flex-col items-center gap-1.5 flex-shrink-0 cursor-pointer">
                    <div class="w-16 h-16 rounded-full gold-border p-0.5">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80" class="w-full h-full object-cover rounded-full">
                    </div>
                    <span class="text-[11px] text-gray-300 font-medium">صقر الرياض</span>
                </div>
                <div class="flex flex-col items-center gap-1.5 flex-shrink-0 cursor-pointer">
                    <div class="w-16 h-16 rounded-full gold-border p-0.5">
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" class="w-full h-full object-cover rounded-full">
                    </div>
                    <span class="text-[11px] text-gray-300 font-medium">سلطان دبي</span>
                </div>
                <div class="flex flex-col items-center gap-1.5 flex-shrink-0 cursor-pointer">
                    <div class="w-16 h-16 rounded-full gold-border p-0.5">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80" class="w-full h-full object-cover rounded-full">
                    </div>
                    <span class="text-[11px] text-gray-300 font-medium">ريم الكويت</span>
                </div>
            </div>

            <!-- البانر الترويجي الفاخر -->
            <div class="relative rounded-3xl overflow-hidden glow-gold border border-amber-500/40 p-5 bg-gradient-to-r from-amber-950/40 via-gray-900 to-gray-900">
                <div class="relative z-10 flex flex-col gap-2">
                    <span class="bg-amber-500 text-gray-950 font-black text-[10px] px-2.5 py-0.5 rounded-full w-max">✨ سهرات VIP حية</span>
                    <h2 class="text-lg font-black text-white">جلسات خليجية تجمبع الأجواد</h2>
                    <p class="text-xs text-gray-400">اختر صالتك المفضل وابدأ السوالف مع ضيوف السهرة الآن.</p>
                </div>
            </div>

            <!-- قائمة الرومات الفخمة -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="switchTab('chat'); changeRoom('الرياض')" class="bg-gradient-to-br from-gray-900 to-[#111827] border border-amber-500/30 hover:border-amber-500 p-4 rounded-2xl text-right transition flex flex-col gap-2 group shadow-lg">
                    <span class="text-2xl">🌴</span>
                    <span class="font-bold text-amber-400 text-sm group-hover:translate-x-1 transition">صالة الرياض</span>
                    <span class="text-[10px] text-emerald-400 font-medium">1,840 متواجد</span>
                </button>
                <button onclick="switchTab('chat'); changeRoom('جدة')" class="bg-gradient-to-br from-gray-900 to-[#111827] border border-gray-800 hover:border-amber-500/50 p-4 rounded-2xl text-right transition flex flex-col gap-2 group shadow-lg">
                    <span class="text-2xl">🌊</span>
                    <span class="font-bold text-gray-200 text-sm group-hover:translate-x-1 transition">سهرة جدة</span>
                    <span class="text-[10px] text-emerald-400 font-medium">1,210 متواجد</span>
                </button>
                <button onclick="switchTab('chat'); changeRoom('الكويت')" class="bg-gradient-to-br from-gray-900 to-[#111827] border border-gray-800 hover:border-amber-500/50 p-4 rounded-2xl text-right transition flex flex-col gap-2 group shadow-lg">
                    <span class="text-2xl">🇰🇼</span>
                    <span class="font-bold text-gray-200 text-sm group-hover:translate-x-1 transition">ديوانية الكويت</span>
                    <span class="text-[10px] text-emerald-400 font-medium">950 متواجد</span>
                </button>
                <button onclick="switchTab('chat'); changeRoom('دبي')" class="bg-gradient-to-br from-gray-900 to-[#111827] border border-gray-800 hover:border-amber-500/50 p-4 rounded-2xl text-right transition flex flex-col gap-2 group shadow-lg">
                    <span class="text-2xl">🇦🇪</span>
                    <span class="font-bold text-gray-200 text-sm group-hover:translate-x-1 transition">جلسة دبي</span>
                    <span class="text-[10px] text-emerald-400 font-medium">1,100 متواجد</span>
                </button>
            </div>
        </div>

        <!-- تبويب الشات الحي (مخفي افتراضياً يظهر عند اختيار روم) -->
        <div id="view-chat" class="hidden flex-col h-[calc(100vh-200px)]">
            <div class="bg-gray-900/90 border border-gray-800 rounded-2xl flex flex-col h-full shadow-2xl overflow-hidden">
                <div class="bg-gray-950/60 p-3 border-b border-gray-800 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <button onclick="switchTab('home')" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded-lg">← الرومات</button>
                        <h3 id="current-room-title" class="font-bold text-amber-400 text-xs">🌴 صالة الرياض</h3>
                    </div>
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full">● مباشر</span>
                </div>

                <!-- الرسائل -->
                <div id="chat-messages" class="flex-1 overflow-y-auto p-3 flex flex-col gap-3 text-xs">
                    <div class="text-center text-gray-500 my-auto">جاري تحميل السوالف الحية...</div>
                </div>

                <!-- إدخال الرسالة -->
                <form id="chat-form" onsubmit="sendMessage(event)" class="p-3 bg-gray-950
